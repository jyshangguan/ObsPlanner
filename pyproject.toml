[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsplanner"
version = "0.2.1"
description = "A Streamlit astronomical target visibility planner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "astropy>=6.0",
    "astroplan>=0.10",
    "astroquery>=0.4.7",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "streamlit>=1.60",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
desktop = [
    "platformdirs>=4.2",
    "pyinstaller>=6.10",
    "pywebview>=5.3",
]

[project.scripts]
obsplanner-desktop = "obsplanner.desktop.launcher:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
